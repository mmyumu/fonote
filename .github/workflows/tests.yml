name: Tests
# Normandy reruns it every night on main (workflow_dispatch): keep that trigger.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s backend
  android-checks:
    # The logic that does without Android, checked by its asserts: no emulator, no Gradle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Android ships org.json; the script uses the copy in android/checks/lib, so no download can fail the run.
      - run: bash android/checks/run.sh
