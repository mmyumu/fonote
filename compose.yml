services:
  backend:
    image: ${FONOTE_BACKEND_IMAGE:-registry.mmyumu.fr/fonote-backend:1.0.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fonote-backend
    environment:
      # Sans jeton le serveur répond 401 à tout : mieux vaut refuser de démarrer que d'exposer
      # un espace personnel inaccessible.
      FONOTE_TOKEN: ${FONOTE_TOKEN:?definir FONOTE_TOKEN dans .env}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    volumes:
      - fonote_backend_data:/data

volumes:
  fonote_backend_data:
