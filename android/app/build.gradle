plugins { id 'com.android.application' }

/**
 * La signature de la version distribuée. La clé et ses mots de passe vivent hors du dépôt,
 * dans un fichier de propriétés que le build lit s'il est là : une clé versionnée est une clé
 * publique, et n'importe qui pourrait alors signer une mise à jour de Fonote. Absent — sur une
 * autre machine, ou en intégration continue — le release sort non signé et le dit dans son nom,
 * plutôt que de faire échouer un build qui n'avait pas à distribuer quoi que ce soit.
 */
def signingFile = file("${System.properties['user.home']}/.android/fonote-signing.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'fr.fonote'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.fonote'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'fr.fonote.OfflineChecks'
    }
    if (signingFile.exists()) {
        signingConfigs {
            release {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildFeatures { buildConfig true }
    /**
     * L'adresse que l'application interroge quand personne n'en a saisi une. Elle est écrite
     * ici plutôt que dans le code parce qu'elle n'est pas la même selon ce qu'on construit :
     * une version distribuée parle au vrai serveur, en HTTPS — le manifeste principal refuse
     * le trafic en clair — tandis qu'un build de développement parle à la machine qui l'a
     * produit, que l'émulateur atteint à 10.0.2.2. Chaque build s'en sert sans rien demander :
     * une adresse qu'il faudrait ressaisir avant la première requête ne serait pas un défaut.
     */
    buildTypes {
        debug {
            buildConfigField 'String', 'SERVER', '"http://10.0.2.2:8080"'
        }
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            buildConfigField 'String', 'SERVER', '"https://fonote.mmyumu.fr"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/**
 * Le nom du fichier produit. Par défaut le plugin le tire du nom du module et du type de
 * build — « app-debug.apk » — ce qui ne dit ni quelle application ni quelle version on
 * tient dès que le fichier a quitté le dossier de build. Il porte donc le nom du projet
 * et sa version ; le type de build n'apparaît que lorsqu'il n'est pas « release », parce
 * qu'un fichier sans mention est celui qu'on distribue.
 *
 * <p>Un release sans clé de signature garde « unsigned » dans son nom, comme le plugin le
 * fait par défaut. C'est le seul avertissement qu'on ait : un APK non signé ne s'installe
 * nulle part, et un fichier qui s'appellerait « fonote-1.0.0.apk » sans l'être laisserait
 * croire l'inverse jusqu'à l'appareil de quelqu'un d'autre.
 */
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def signed = android.buildTypes.getByName(variant.buildType).signingConfig != null
            def suffix = variant.buildType != 'release' ? "-${variant.buildType}"
                : (signed ? '' : '-unsigned')
            output.outputFileName.set("fonote-${android.defaultConfig.versionName}${suffix}.apk")
        }
    }
}
