services:
  backend:
    image: ${FONOTE_BACKEND_IMAGE:-registry.mmyumu.fr/fonote-backend:1.5.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fonote-backend
    environment:
      # Without a token the server answers 401 to everything: better to refuse to start than to
      # expose a personal space nobody can reach.
      FONOTE_TOKEN: ${FONOTE_TOKEN:?definir FONOTE_TOKEN dans .env}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    volumes:
      - fonote_backend_data:/data
      # The Android version to hand out: the APK and its output-metadata.json, copied from
      # android/app/build/outputs/apk/release/. Read-only; the server never writes there.
      - ./apk:/apk:ro

volumes:
  fonote_backend_data:
