plugins { id 'com.android.application' }

/**
 * The signing of the distributed version. The key and its passwords live outside the
 * repository, in a properties file the build reads if it is there: a versioned key is a public
 * key, and anyone could then sign an update of Fonote. When it is missing — on another machine,
 * or in continuous integration — the release comes out unsigned and says so in its name, rather
 * than failing a build that had nothing to distribute.
 */
def signingFile = file("${System.properties['user.home']}/.android/fonote-signing.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'fr.fonote'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.fonote'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '1.4.0'
        testInstrumentationRunner 'fr.fonote.OfflineChecks'
    }
    if (signingFile.exists()) {
        signingConfigs {
            release {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildFeatures { buildConfig true }
    /**
     * The address the app queries when nobody has entered one. It is written here rather
     * than in the code because it depends on what is being built: a distributed version talks
     * to the real server, over HTTPS — the main manifest refuses cleartext traffic — while a
     * development build talks to the machine that produced it, which the emulator reaches at
     * 10.0.2.2. Every build uses it without asking anything: an address that had to be typed
     * in again before the first request would not be a default.
     */
    buildTypes {
        debug {
            buildConfigField 'String', 'SERVER', '"http://10.0.2.2:8080"'
        }
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            buildConfigField 'String', 'SERVER', '"https://fonote.mmyumu.fr"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/**
 * The name of the produced file. By default the plugin derives it from the module name and
 * the build type — "app-debug.apk" — which says neither which app nor which version you hold
 * once the file has left the build folder. So it carries the project name and its version;
 * the build type only appears when it is not "release", because a file with no mention is the
 * one that gets distributed.
 *
 * <p>A release without a signing key keeps "unsigned" in its name, as the plugin does by
 * default. It is the only warning there is: an unsigned APK installs nowhere, and a file
 * called "fonote-1.0.0.apk" without being signed would suggest otherwise until it reached
 * someone else's device.
 */
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def signed = android.buildTypes.getByName(variant.buildType).signingConfig != null
            def suffix = variant.buildType != 'release' ? "-${variant.buildType}"
                : (signed ? '' : '-unsigned')
            output.outputFileName.set("fonote-${android.defaultConfig.versionName}${suffix}.apk")
        }
    }
}
